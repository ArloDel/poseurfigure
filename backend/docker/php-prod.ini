upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
expose_php = Off
display_errors = Off
log_errors = On

; Code never changes inside a running container, so OPcache never needs to look at the files again.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
