upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
expose_php = Off

; The dev server runs on the CLI SAPI, where OPcache is off by default.
; Without it every request re-parses the whole framework from the (slow) Windows bind mount.
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Dev: still pick up edited files, but check at most every 2 seconds.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
