; FigurePose pool settings, loaded after the image's www.conf.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; Container env vars (DB_HOST, AI_SERVICE_URL...) reach Laravel.
clear_env = no
; Requests slower than this are logged with a stack trace.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2
; Health checks from the container itself.
ping.path = /fpm-ping
