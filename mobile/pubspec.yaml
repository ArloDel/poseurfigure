name: figurepose
description: "FigurePose AI: posing ideas and joint-by-joint guidance for action figures."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  dio: ^5.11.1
  image_picker: ^1.2.4
  cached_network_image: ^4.0.6
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Bundled (OFL) so the app works offline and tests don't fetch fonts.
  fonts:
    - family: BowlbyOne
      fonts:
        - asset: assets/fonts/BowlbyOne-Regular.ttf
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
