# Local development stack. Not production-ready: see README "Production notes".
name: figurepose

x-backend-env: &backend-env
  APP_ENV: local
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: figurepose
  DB_USERNAME: figurepose
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  FILESYSTEM_DISK: s3
  FIGUREPOSE_IMAGE_DISK: s3
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: figurepose-images
  AWS_ENDPOINT: http://storage:8333
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  AI_SERVICE_URL: http://ai:8001
  # CPU inference takes ~8-12 s per photo; leave headroom for a busy machine.
  AI_SERVICE_TIMEOUT: "60"
  SKELETON_PROFILES_PATH: /shared/skeleton_profiles
  CATALOG_PATH: /shared/catalog/poses.json
  # AI visuals: on for development with the stub provider (see ai service). Turn off without a real provider in production.
  GENERATION_ENABLED: "true"

services:
  api:
    build: ./backend
    container_name: figurepose-api
    environment:
      <<: *backend-env
      RUN_SETUP: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      # vendor/ lives in a volume: reading it through the Windows bind mount made every request take 8+ s.
      # After changing composer.json: docker compose build && docker compose down && docker volume rm figurepose_backend_vendor
      - backend_vendor:/var/www/vendor
      - ./shared:/shared:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
      ai: { condition: service_healthy }

  worker:
    build: ./backend
    container_name: figurepose-worker
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=5", "--timeout=90"]
    environment: *backend-env
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
      - ./shared:/shared:ro
    depends_on:
      api: { condition: service_started }

  ai:
    build:
      context: ./ai-service
      args: { INSTALL_DEV: "true" }
    container_name: figurepose-ai
    ports:
      - "8001:8001"
    environment:
      # Load the models at startup, so the first analysis isn't slow. First start downloads ~1.3 GB.
      AI_WARMUP: "true"
      # Development stand-in for an image service: returns the original photo, nothing leaves this machine.
      # A real provider is added in ai-service/app/services/image_generator.py; its API key goes in .env.
      AI_GENERATION_PROVIDER: stub
    volumes:
      - ./shared:/shared:ro
      - model_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Warm-up (and the first model download) happens before the service answers.
      start_period: 600s

  postgres:
    image: pgvector/pgvector:pg17
    container_name: figurepose-db
    environment:
      POSTGRES_DB: figurepose
      POSTGRES_USER: figurepose
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"   # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U figurepose -d figurepose"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: figurepose-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. MinIO no longer publishes container images, so SeaweedFS is used instead.
  storage:
    image: chrislusf/seaweedfs:4.53
    container_name: figurepose-storage
    entrypoint: ["sh", "/start.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "8333:8333"   # S3 API
    volumes:
      - storage_data:/data
      - ./infrastructure/seaweedfs/start.sh:/start.sh:ro
    healthcheck:
      # Any HTTP answer (even 403 without credentials) means the S3 API is up.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  storage_data:
  backend_vendor:
  model_cache:
