# One origin for everything: the web app at /, the API at /api, catalog photos at /catalog.
# Same origin means no CORS. TLS is added in front of this (see README "Deploying").

# Request ID: reuse the client's if it is a short plain token, else make one. Sent to Laravel (which adds
# it to every log line), logged here, and returned to the client once.
map $http_x_request_id $req_id {
    "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
    default                   $request_id;
}

log_format json_access escape=json '{"time":"$time_iso8601","request_id":"$req_id","method":"$request_method",'
                            '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                            '"duration":$request_time,"upstream":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout json_access;

    # Photos up to 12 MB (the API's own limit is checked again in Laravel).
    client_max_body_size 14m;

    include /etc/nginx/snippets/security-headers.inc;

    # The API: every request goes to Laravel's front controller in the PHP-FPM container.
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_REQUEST_ID $req_id;
        fastcgi_pass api:9000;
        fastcgi_read_timeout 90s;
        # Laravel echoes the same ID; send it once, also on errors Laravel never saw (502, 504).
        fastcgi_hide_header X-Request-Id;
        add_header X-Request-Id $req_id always;
        include /etc/nginx/snippets/security-headers.inc;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass api:9000;
    }

    # Catalog reference photos, copied into this image from backend/public/catalog.
    location /catalog/ {
        root /srv;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    # The Flutter web app. Unknown paths fall back to index.html so deep links work.
    location / {
        root /srv/web;
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell, so a new build shows up on the next load.
    location = /index.html {
        root /srv/web;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.inc;
    }

    location = /flutter_service_worker.js {
        root /srv/web;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.inc;
    }
}
